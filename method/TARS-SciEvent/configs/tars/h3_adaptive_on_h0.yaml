# TARS-H3b = H2b + frequency-adaptive prototype blending, without tuple anchoring.
#
#   lambda_r = kappa / (kappa + n_r),  n_r = TRAIN-only frequency of role r
#
# TRAIN frequencies: Context 1053, Method 968, Results 911, Challenge 406,
# Purpose 254, Implications 235, Analysis 67, Contradictions 2, Ethical 1.
# With kappa=20 that puts Ethical at lambda=0.95 (almost pure definition) and
# Context at lambda=0.02 (almost pure learned), which is the intended behaviour.
inherit: h2_proto_on_h0.yaml
experiment: h3_adaptive_on_h0

model:
  prototype_mode: adaptive
  # kappa tuned on dev over the plan's grid {5, 20, 50}, 3 seeds each
  # (artifacts/final/report/funnel.dev.json):
  #   kappa=5  -> 33.58 +/- 0.42   improves over H0 in 3/3 seeds
  #   kappa=20 -> 31.83 +/- 1.12
  #   kappa=50 -> 33.38 +/- 1.85
  # kappa=5 wins on both mean and stability; it keeps only the genuinely rare
  # roles near their definition vector (Ethical lambda=0.83, Contradictions 0.71,
  # Analysis 0.07) while leaving frequent roles essentially free.
  prototype_kappa: 5.0
